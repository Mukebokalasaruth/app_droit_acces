<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Soumettre preuve</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>tailwind.config = { theme: { extend: { colors: { ink: "#172033", brand: "#0f766e", gold: "#d89b22" }, boxShadow: { soft: "0 20px 60px rgba(15, 23, 42, .10)" } } } }</script>
</head>
<body class="min-h-screen bg-[#f5f7fb] text-ink">
    <main class="mx-auto max-w-4xl px-6 py-8">
        <a class="text-sm font-semibold text-brand hover:text-teal-900" href="acceuil.html">Retour au tableau de bord</a>
        <section class="mt-6 rounded-lg bg-white p-8 shadow-soft ring-1 ring-slate-200">
            <p class="text-sm font-semibold uppercase tracking-[.18em] text-gold">Depot de justificatif</p>
            <h1 class="mt-3 text-3xl font-bold">Soumettre une preuve de paiement</h1>
            <p class="mt-3 text-slate-600">Selectionnez une image ou un PDF. Taille maximale recommandee: 5 Mo.</p>

            <form id="form" class="mt-8 space-y-6">
                <label class="block rounded-lg border-2 border-dashed border-slate-300 bg-slate-50 p-8 text-center transition hover:border-brand hover:bg-teal-50">
                    <span class="block text-lg font-bold">Choisir le fichier</span>
                    <span class="mt-2 block text-sm text-slate-600">PNG, JPG, JPEG ou PDF</span>
                    <input class="mt-5 w-full rounded-lg border border-slate-300 bg-white px-4 py-3 text-sm" type="file" id="file" accept=".png,.jpg,.jpeg,.pdf" required>
                </label>
                <button class="h-12 rounded-lg bg-brand px-8 font-semibold text-white shadow-lg shadow-teal-900/15 transition hover:bg-teal-800" type="submit">Envoyer la preuve</button>
            </form>
            <p id="message" class="mt-5 min-h-6 text-sm font-semibold"></p>
        </section>
    </main>
    <script src="../script/soumettrePreuve.js"></script>
</body>
</html>
