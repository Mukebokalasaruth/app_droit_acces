<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verifier acces</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>tailwind.config = { theme: { extend: { colors: { ink: "#172033", brand: "#0f766e", gold: "#d89b22" }, boxShadow: { soft: "0 20px 60px rgba(15, 23, 42, .10)" } } } }</script>
</head>
<body class="min-h-screen bg-[#f5f7fb] text-ink">
    <main class="mx-auto max-w-4xl px-6 py-8">
        <a class="text-sm font-semibold text-brand hover:text-teal-900" href="acceuil.html">Retour au tableau de bord</a>
        <section class="mt-6 rounded-lg bg-white p-8 shadow-soft ring-1 ring-slate-200">
            <p class="text-sm font-semibold uppercase tracking-[.18em] text-gold">Controle d'entree</p>
            <h1 class="mt-3 text-3xl font-bold">Verifier le droit d'acces</h1>
            <form id="verifyForm" class="mt-8 flex flex-wrap items-end gap-3">
                <label class="block flex-1">
                    <span class="text-sm font-semibold text-slate-700">Matricule</span>
                    <input class="mt-2 h-12 w-full rounded-lg border border-slate-300 px-4 outline-none focus:border-brand focus:ring-4 focus:ring-teal-100" id="matricule" type="text" placeholder="Ex : 22MK289" required>
                </label>
                <button class="h-12 rounded-lg bg-brand px-8 font-semibold text-white shadow-lg shadow-teal-900/15 hover:bg-teal-800" type="submit">Verifier</button>
            </form>
            <div id="resultCard" class="mt-8 rounded-lg border border-slate-200 bg-slate-50 p-6 text-slate-600">Entrez un matricule pour afficher le resultat.</div>
        </section>
    </main>
    <script src="../script/verifierAcces.js"></script>
</body>
</html>
