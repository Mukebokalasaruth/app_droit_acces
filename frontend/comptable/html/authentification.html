<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion Comptable</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>tailwind.config = { theme: { extend: { colors: { ink: "#172033", brand: "#0f766e", gold: "#d89b22" }, boxShadow: { soft: "0 20px 60px rgba(15, 23, 42, .12)" } } } }</script>
</head>
<body class="min-h-screen bg-[#f5f7fb] text-ink">
    <main class="grid min-h-screen lg:grid-cols-[.95fr_1.05fr]">
        <section class="flex items-center justify-center px-6 py-10">
            <form id="loginForm" class="w-full max-w-md rounded-lg bg-white p-8 shadow-soft ring-1 ring-slate-200">
                <img class="mb-6 h-14 w-14 rounded-lg bg-white object-contain p-1 ring-1 ring-slate-200" src="../../image/logo.jpeg" alt="Logo Droit d'acces">
                <p class="text-sm font-semibold uppercase tracking-[.18em] text-gold">Service comptable</p>
                <h1 class="mt-2 text-3xl font-bold">Connexion</h1>
                <p class="mt-3 text-sm leading-6 text-slate-600">Accedez a la validation des preuves et a la configuration des criteres de paiement.</p>
                <div class="mt-8 space-y-5">
                    <label class="block">
                        <span class="text-sm font-semibold text-slate-700">Login</span>
                        <input class="mt-2 h-12 w-full rounded-lg border border-slate-300 px-4 outline-none focus:border-brand focus:ring-4 focus:ring-teal-100" type="text" id="login" placeholder="comptable" required>
                    </label>
                    <label class="block">
                        <span class="text-sm font-semibold text-slate-700">Mot de passe</span>
                        <input class="mt-2 h-12 w-full rounded-lg border border-slate-300 px-4 outline-none focus:border-brand focus:ring-4 focus:ring-teal-100" type="password" id="password" placeholder="Votre mot de passe" required>
                    </label>
                    <button class="h-12 w-full rounded-lg bg-brand font-semibold text-white shadow-lg shadow-teal-900/15 hover:bg-teal-800" type="submit">Se connecter</button>
                </div>
                <p id="message" class="mt-5 min-h-6 text-sm font-semibold"></p>
            </form>
        </section>
        <section class="relative hidden overflow-hidden bg-ink lg:block">
            <img class="absolute inset-0 h-full w-full object-cover opacity-55" src="https://images.unsplash.com/photo-1554224155-6726b3ff858f?auto=format&fit=crop&w=1400&q=80" alt="">
            <div class="absolute inset-0 bg-gradient-to-br from-ink via-ink/80 to-brand/75"></div>
            <div class="relative flex h-full items-end p-12 text-white">
                <div class="max-w-xl">
                    <p class="mb-4 inline-flex rounded-full bg-white/12 px-4 py-2 text-sm text-white/85 ring-1 ring-white/15">Controle financier</p>
                    <h2 class="text-5xl font-bold leading-tight">Decidez vite, avec des preuves visibles et un suivi propre.</h2>
                    <p class="mt-5 text-lg leading-8 text-white/78">Une console simple pour fiabiliser la validation avant l'acces aux examens.</p>
                </div>
            </div>
        </section>
    </main>
    <script src="../script/authentification.js"></script>
</body>
</html>
