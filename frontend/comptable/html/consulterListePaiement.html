<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Preuves de paiement</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>tailwind.config = { theme: { extend: { colors: { ink: "#172033", brand: "#0f766e", gold: "#d89b22" }, boxShadow: { soft: "0 20px 60px rgba(15, 23, 42, .10)" } } } }</script>
</head>
<body class="min-h-screen bg-[#f5f7fb] text-ink">
    <main class="mx-auto max-w-7xl px-6 py-8">
        <a class="text-sm font-semibold text-brand hover:text-teal-900" href="acceuil.html">Retour au tableau de bord</a>
        <section class="mt-6 rounded-lg bg-white p-8 shadow-soft ring-1 ring-slate-200">
            <div class="flex flex-wrap items-end justify-between gap-4">
                <div>
                    <p class="text-sm font-semibold uppercase tracking-[.18em] text-gold">Validation</p>
                    <h1 class="mt-3 text-3xl font-bold">Preuves de paiement</h1>
                </div>
                <form id="filterForm" class="flex flex-wrap items-end gap-3">
                    <label class="block">
                        <span class="text-sm font-semibold text-slate-700">Promotion</span>
                        <select class="mt-2 h-12 min-w-64 rounded-lg border border-slate-300 bg-white px-4 outline-none focus:border-brand focus:ring-4 focus:ring-teal-100" id="idPromotion" required></select>
                    </label>
                    <button class="h-12 rounded-lg bg-brand px-6 font-semibold text-white shadow-lg shadow-teal-900/15 hover:bg-teal-800" type="submit">Afficher</button>
                </form>
            </div>
            <p id="message" class="mt-5 min-h-6 text-sm font-semibold"></p>
            <div class="mt-6 overflow-hidden rounded-lg border border-slate-200">
                <div class="overflow-x-auto">
                    <table class="min-w-full divide-y divide-slate-200 text-sm">
                        <thead class="bg-slate-50 text-left text-xs font-bold uppercase tracking-[.12em] text-slate-500">
                            <tr>
                                <th class="px-5 py-4">Etudiant</th>
                                <th class="px-5 py-4">Matricule</th>
                                <th class="px-5 py-4">Date</th>
                                <th class="px-5 py-4">Statut</th>
                                <th class="px-5 py-4">Preuve</th>
                                <th class="px-5 py-4">Actions</th>
                            </tr>
                        </thead>
                        <tbody id="preuvesBody" class="divide-y divide-slate-200 bg-white">
                            <tr><td class="px-5 py-8 text-center text-slate-500" colspan="6">Selectionnez une promotion.</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </section>
    </main>
    <script src="../script/consulterPreuve.js"></script>
</body>
</html>
